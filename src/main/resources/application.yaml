spring:
  application:
    name: room-booking
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info

booking:
  opening-time: "08:00"
  closing-time: "20:00"
  slot-duration: 30m
  max-room-capacity: 50
