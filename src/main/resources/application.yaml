spring:
  application:
    name: room-booking
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
booking:
  opening-time: "08:00"
  closing-time: "20:00"
  slot-duration: 30m
  max-room-capacity: 50
